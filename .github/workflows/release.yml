name: Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'tests/**'
      - 'bin/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
          coverage: none

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          current=$(grep -iE '^\s*\*?\s*Version:' tutorlms-analytics.php | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)
          echo "header=${current:-none}  latest_tag=${latest_tag:-none}"

          if [ -z "${latest_tag}" ]; then
            next="${current:-0.1.0}"
          else
            higher=$(printf '%s\n%s\n' "$current" "$latest_tag" | sort -V | tail -1)
            if [ -n "$current" ] && [ "$higher" = "$current" ] && [ "$current" != "$latest_tag" ]; then
              next="$current"
            else
              IFS=. read -r MA MI PA <<< "$latest_tag"
              next="${MA}.${MI}.$((PA + 1))"
            fi
          fi

          if ! printf '%s' "$next" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Computed version '$next' is not valid semver; aborting." >&2
            exit 1
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (tag v$next)"

      - name: Stamp version into plugin
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" tutorlms-analytics.php
          sed -i -E "s/(TUTORLMS_ANALYTICS_VERSION', ')[0-9.]+(')/\1${NEXT}\2/" tutorlms-analytics.php
          sed -i -E "s/(TUTORLMS_ANALYTICS_VERSION', ')[0-9.]+(')/\1${NEXT}\2/" tests/bootstrap.php
          echo "Stamped ${NEXT}:"
          grep -REn 'Version:|_VERSION' tutorlms-analytics.php tests/bootstrap.php | grep -F "${NEXT}"

      - name: Make build script executable
        run: chmod +x bin/build.sh

      - name: Build plugin zips
        run: bin/build.sh

      - name: List artifacts
        run: ls -lh dist/

      - name: Validate packaged plugin ZIP in clean WordPress
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-wp
          mkdir -p /tmp/release-wp
          cd /tmp/release-wp

          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost --title="Release Validation" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email --allow-root

          wp plugin install tutor --activate --allow-root

          plugin_zip="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.zip' | head -n1)"
          test -n "$plugin_zip"

          wp plugin install "$plugin_zip" --activate --force --allow-root
          wp plugin is-active tutorlms-analytics --allow-root

          test "$(wp plugin get tutorlms-analytics --field=version --allow-root)" = "$NEXT"

          wp plugin deactivate tutorlms-analytics --allow-root
          wp plugin activate tutorlms-analytics --allow-root
          wp plugin is-active tutorlms-analytics --allow-root

          wp eval 'echo "Packaged TutorLMS Analytics plugin loaded successfully.\n";' --allow-root

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing assets."
            gh release upload "$TAG" dist/*.zip --clobber
          else
            echo "Creating release $TAG at ${GITHUB_SHA}."
            gh release create "$TAG" dist/*.zip \
              --target "${GITHUB_SHA}" \
              --title "$TAG" \
              --generate-notes
          fi
